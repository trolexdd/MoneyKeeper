services:
  db:
    image: postgres:16-alpine
    container_name: moneykeeper-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneykeeper
      POSTGRES_USER: moneykeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneykeeper}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moneykeeper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneykeeper -d moneykeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneykeeper_pgdata:
